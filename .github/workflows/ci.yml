name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Valores fictícios: o build não acessa o Supabase (páginas são dinâmicas).
      NEXT_PUBLIC_SUPABASE_URL: https://exemplo.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: chave-anon-ficticia-para-build-000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Testes (regras de negócio + banco com PGlite)
        run: pnpm test
      - run: pnpm build
